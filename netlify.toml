# Netlify settings. You should not need to change this file.

[build]
  # The site is plain HTML. This just copies the public files into "dist" so
  # that only the website itself is published (not the function source code).
  command = "rm -rf dist && mkdir dist && cp -R *.html css js images dist/"
  publish = "dist"
  functions = "netlify/functions"   # chat assistant, booking email, sign-in

[functions]
  node_bundler = "esbuild"

# Cache photos so repeat visits are fast.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Signed-in pages are never cached.
[[headers]]
  for = "/account.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/owner.html"
  [headers.values]
    Cache-Control = "no-store"
